<text x="168" y="922" text-anchor="middle" fill="#12203c" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700">6</text>
<text x="211" y="907" fill="#f5f7ff" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">One answer</text>
<text x="211" y="941" fill="#bdcde3" font-family="DejaVu Sans,Arial,sans-serif" font-size="20">Deliver an integrated, traceable result</text>
