# Optional: a Postgres container on the same port/credentials the API expects.
# Not needed if Postgres is already running locally on 5433.
services:
  postgres:
    image: postgres:16
    container_name: vaken-postgres
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: vaken_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
